[project]
name = "hust-student-assistant"
version = "0.1.0"
description = "Independent student assistant API and read-only academic MCP"
requires-python = ">=3.10"
dependencies = [
  "anyio>=4.8,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7", "PyJWT>=2.10,<3", "langgraph>=1,<2",
  "mcp>=1.26,<2", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Hai service chạy từ thư mục riêng, không đóng gói chung hai namespace src.
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]
known-third-party = ["mcp"]
