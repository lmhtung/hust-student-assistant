# Cấu hình local. Xem config.example.yaml để biết ý nghĩa từng mục.
# ASSISTANT_AUTH_SECRET và ASSISTANT_MCP_SECRET vẫn lấy từ .env.
app:
  host: 0.0.0.0
  port: 8023
  reload: false
  log_level: info
  request_timeout: 120
  max_concurrent_requests: 8

ui:
  host: 0.0.0.0
  port: 5173

llm:
  api_key: sk-1234
  base_url: http://localhost:8024/v1
  default_model: qwen3-8b-fp8
  temperature: 0.0
  max_tokens: 3000
  enable_thinking: false
  send_chat_template_kwargs: true

embeddings:
  enabled: false # Client embedding chưa triển khai.
  api_key: sk-1234
  base_url: http://localhost:8026/v1
  model: qwen3-embedding-4b
  max_input_tokens: 31950

mcp:
  url: http://127.0.0.1:8002/mcp
  timeout: 20

agents:
  max_tool_rounds: 5
  max_tool_calls: 12

short_memory:
  enabled: false # Không đưa lịch sử vào model; vẫn lưu hội thoại riêng.
  history_path: data/conversations.sqlite3
  max_messages: 24

long_memory:
  enabled: false # Chưa triển khai long memory/RAG.
